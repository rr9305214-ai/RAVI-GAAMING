
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAVI GAMING</title>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#080d19">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #080d19, #14294a, #101525);
  color: white;
  text-align: center;
}


header {
  background: #080d19;
  padding: 25px;
  border-bottom: 3px solid #00d9ff;
}

header h1 {
  color: #00d9ff;
  font-size: 32px;
}

.container {
  width: 90%;
  max-width: 700px;
  margin: 30px auto;
}

.card {
  background: #1c2940;
  padding: 25px;
  margin: 20px 0;
  border-radius: 15px;
  box-shadow: 0 0 12px #00d9ff44;
}

h2 {
  color: #00d9ff;
}

button {
  background: #00c8ff;
  color: #08111d;
  border: none;
  padding: 14px 25px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #ffffff;
}

#leaderboard {
  text-align: left;
  font-size: 18px;
  line-height: 2;
}

footer {
  background: #080d19;
  padding: 20px;
  margin-top: 40px;
}

.game {
  background: linear-gradient(145deg, #1c2940, #101b30);
  padding: 25px;
  margin: 20px 0;
  border-radius: 18px;
  border: 2px solid #00d9ff;
  transition: 0.3s;
}

.game:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 20px #00d9ff;
}

.game h3 {
  color: #00d9ff;
  font-size: 24px;
}


#searchGame {
  width: 90%;
  padding: 14px;
  border: 2px solid #00d9ff;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
}

.navbar {
  background: #080d19;
  padding: 18px 10px;
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  border-bottom: 2px solid #00d9ff;
}

.navbar a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  padding: 10px;
  border-radius: 6px;
}

.navbar a:hover {
  background: #00d9ff;
  color: black;
}

.game img {
  width: 100%;
  max-width: 300px;
  height: 150px;
  object-fit: cover;
  border-radius: 12px;
  margin: 10px;
}

/* Mobile Responsive Design */

@media screen and (max-width: 600px) {

  header h1 {
    font-size: 25px;
  }

  .container {
    width: 95%;
  }

  .card {
    padding: 15px;
  }

  .navbar {
    flex-direction: column;
    gap: 5px;
  }

  .navbar a {
    display: block;
  }

  button {
    width: 90%;
    max-width: 300px;
  }

  .game img {
    width: 100%;
    height: auto;
  }

}
/* Light Mode */

body.light-mode {
  background: #f0f4f8;
  color: #111827;
}

body.light-mode header,
body.light-mode footer,
body.light-mode .navbar {
  background: #ffffff;
}

body.light-mode .card,
body.light-mode .game {
  background: #e0eaf5;
  color: #111827;
}

body.light-mode .navbar a {
  color: #111827;
}

body.light-mode h2,
body.light-mode .game h3 {
  color: #0077aa;
}




</style>
</head>

<body>
  
<nav class="navbar">
  
<button onclick="toggleTheme(); playSound()" id="themeBtn">
  🌙 Dark / Light Mode
</button>

  <a href="index.html">🏠 Home</a>
  <a href="carrom.html">Carrom</a>
  <a href="tictactoe.html">Tic Tac Toe</a>
  <a href="clickgame.html">Click Challenge</a>
</nav>


<header>
  <h1>🎮 RAVI GAMING</h1>
  <p>Welcome to My Gaming Website</p>
</header>


<div class="card">
  
<div class="card">
  <h2>🔍 Search Games</h2>

  <input
    type="text"
    id="searchGame"
    placeholder="Search your game..."
    onkeyup="searchGames()"
  >
</div>

  <h2>🎮 My Games</h2>

  <div class="game">
    <h3>🏏 Carrom Game</h3>
    
<img
  src="https://placehold.co/300x150/14294a/00d9ff?text=CARROM+GAME"
  alt="Carrom Game"
  width="250"
>

    <p>Play Carrom with Friends</p>
    <a href="carrom.html">
      <button>Play Carrom</button>
    </a>
  </div>

  <div class="game">
    <h3>⭕ Tic Tac Toe</h3>
    <p>Play Two Player Game</p>
    <a href="tictactoe.html">
      <button>Play Tic Tac Toe</button>
    </a>
  </div>

  <div class="game">
    <h3>⚡ Click Challenge</h3>
    <p>Test Your Speed</p>
    <a href="clickgame.html">
      <button>Play Click Game</button>
    </a>
  </div>
</div>


<footer>
  <p>© 2026 RAVI GAMING</p>
</footer>

<script>

// Player Name
let playerName =
  localStorage.getItem("playerName") || "Player";

  
// Load Players
let players = JSON.parse(
  localStorage.getItem("players") || "[]"
);


// Find Current Player
let currentPlayer = players.find(
  p => p.name === playerName
);


// Load Scores
let demoScore = currentPlayer
  ? Number(currentPlayer.score) || 0
  : 0;

let bestScore = Math.max(
  Number(localStorage.getItem("bestScore")) || 0,
  demoScore
);


// Show Score
function updateScore() {
  let best = document.getElementById("bestScore");
  let current = document.getElementById("currentScore");

  if (best) best.innerText = bestScore;
  if (current) current.innerText = demoScore;
}


// Show Leaderboard
function showLeaderboard() {

  let list = document.getElementById("leaderboard");

  list.innerHTML = "";

  players.sort((a, b) => b.score - a.score);

  players.forEach((player) => {

    let item = document.createElement("li");

    item.innerText =
      player.name + " - " + player.score + " Points";

    list.appendChild(item);

  });

  if (players.length === 0) {
    list.innerHTML = "<li>No players yet</li>";
  }
}


// Add Score
function addScore() {

  demoScore += 10;

  if (demoScore > bestScore) {
    bestScore = demoScore;

    localStorage.setItem(
      "bestScore",
      bestScore
    );
  }

  let player = players.find(
    p => p.name === playerName
  );

  if (player) {

    player.score = Math.max(
      Number(player.score) || 0,
      demoScore
    );

  } else {

    players.push({
      name: playerName,
      score: demoScore
    });

  }

  localStorage.setItem(
    "players",
    JSON.stringify(players)
  );

  updateScore();

  showLeaderboard();
}


// Start Website
updateScore();

showLeaderboard();

function searchGames() {
  let input = document
    .getElementById("searchGame")
    .value.toLowerCase();

  let games = document.querySelectorAll(".game");

  games.forEach(function(game) {
    let name = game.innerText.toLowerCase();

    if (name.includes(input)) {
      game.style.display = "block";
    } else {
      game.style.display = "none";
    }
  });
}
function toggleTheme() {
  document.body.classList.toggle("light-mode");

  let isLight = document.body.classList.contains("light-mode");

  localStorage.setItem("websiteTheme", isLight ? "light" : "dark");

  document.getElementById("themeBtn").innerText =
    isLight ? "🌙 Dark Mode" : "☀️ Light Mode";
}

// Save Theme
let savedTheme = localStorage.getItem("websiteTheme");

if (savedTheme === "light") {
  document.body.classList.add("light-mode");
  document.getElementById("themeBtn").innerText = "🌙 Dark Mode";
}

function playSound() {
  let audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
  );

  audio.play();
}


</script>

  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("RAVI GAMING App Ready"))
      .catch(error => console.log(error));
  });
}
</script>
</body>
</html>
