<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVI CARROM GAME</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:28px 14px 40px;
  color:#f5f8ff; text-align:center; font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,rgba(0,217,255,.18),transparent 34%),
    radial-gradient(circle at 10% 90%,rgba(124,58,237,.16),transparent 30%),
    linear-gradient(145deg,#080e1d,#101c34 55%,#080e1d);
}
h1{
  margin:5px 0 20px;font-size:clamp(28px,5vw,42px);
  letter-spacing:2px;font-weight:900;color:#8cf0ff;
  text-shadow:0 0 12px rgba(0,217,255,.55),0 4px 18px #000;
}
.scoreboard{
  width:min(94%,500px);margin:0 auto 20px;padding:18px 20px;
  border:1px solid rgba(92,220,255,.55);border-radius:20px;
  background:linear-gradient(145deg,rgba(30,49,78,.96),rgba(13,25,46,.96));
  box-shadow:0 12px 35px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08);
}
.scoreboard h2{display:inline-block;width:48%;margin:5px 0 12px;font-size:clamp(16px,3vw,21px)}
.scoreboard h3{margin:10px 0}
#score1{color:#5bdcff}
#score2{color:#ff7777}
#total{color:#ffe28a}
#status{
  color:#ffe27a;padding:10px;margin:12px 0 5px;border-radius:12px;
  background:rgba(255,255,255,.07);
}
#robotLevel{
  background:#122945;color:white;border:1px solid #50dfff;
  border-radius:10px;padding:10px 14px;font-size:15px
}
canvas{
  display:block;width:min(92vw,500px);height:auto;margin:0 auto 18px;
  background:#e6b878;border:10px solid #80502b;border-radius:18px;
  touch-action:none;
  box-shadow:0 0 0 3px rgba(255,211,143,.18),
  0 18px 45px rgba(0,0,0,.55),0 0 28px rgba(0,217,255,.12);
}
button,select{
  padding:12px 20px;margin:7px;
  background:linear-gradient(135deg,#26d9f5,#009bc8);
  color:#061421;border:1px solid rgba(255,255,255,.28);
  border-radius:12px;cursor:pointer;font-weight:800;font-size:14px;
  box-shadow:0 5px 14px rgba(0,0,0,.25);
  transition:transform .15s,filter .15s;
}
button:hover{transform:translateY(-2px);filter:brightness(1.12)}
#soundBtn{background:linear-gradient(135deg,#b8f28b,#59c77b)}
#pauseBtn{background:linear-gradient(135deg,#ffe18a,#ffb347)}
body>p{color:#dcecff;font-weight:600}
body>div[style*="max-width:350px"]{
  width:min(92%,370px);border:1px solid rgba(92,220,255,.4);
  box-shadow:0 10px 28px rgba(0,0,0,.28);
}
#powerBar{cursor:pointer}
#victoryScreen{
  display:none;position:fixed;inset:0;background:rgba(2,8,20,.88);
  z-index:999;justify-content:center;align-items:center;padding:18px;
  backdrop-filter:blur(8px)
}
.victoryBox{
  background:linear-gradient(145deg,#19375c,#101d35);
  border:2px solid #ffd95a;border-radius:24px;padding:35px 25px;
  width:min(90%,340px);box-shadow:0 0 35px rgba(255,215,0,.38);
}
.victoryBox h1{color:gold;font-size:32px}
.victoryBox button{background:linear-gradient(135deg,#ffe889,#ffbd37)}
@media(max-width:480px){
  body{padding:18px 8px 28px}
  .scoreboard{padding:14px 10px}
  .scoreboard h2{font-size:15px}
  canvas{border-width:7px;border-radius:14px}
  button{padding:11px 14px;margin:5px}
}
</style>
</head>
<body>

<h1>🎮 RAVI CARROM</h1>

<div class="scoreboard">
<h2>🔵 Player 1: <span id="score1">0</span></h2>
<h2>🔴 Player 2 (Robot): <span id="score2">0</span></h2>
<h3>Coins Pocketed: <span id="total">0</span></h3>
<h3 id="status">Player 1 Turn</h3>
<hr>
<h3>🤖 Robot Difficulty</h3>
<select id="robotLevel">
<option value="easy" selected>Easy - आसान</option>
<option value="medium">Medium - सामान्य</option>
<option value="hard">Hard - स्मार्ट</option>
</select>
</div>

<canvas id="board" width="500" height="500"></canvas>

<div id="victoryScreen">
  <div class="victoryBox">
    <h1>🏆 VICTORY!</h1>
    <h2 id="winnerName">PLAYER 1 WINS!</h2>
    <h3 id="finalScore"></h3>
    <button onclick="resetGame()">🔄 PLAY AGAIN</button>
  </div>
</div>

<br>
<button onclick="resetGame()">🔄 Restart</button>
<button onclick="pauseGame()" id="pauseBtn">⏸ Pause</button>
<button onclick="toggleSound()" id="soundBtn">🔊 Sound ON</button>

<p>Striker को पीछे खींचकर छोड़ो।</p>

<div style="max-width:350px;margin:15px auto;background:#253957;padding:12px;border-radius:12px">
<h3>🎯 STRIKER POWER: <span id="powerValue">50</span>%</h3>
<input type="range" id="powerBar" min="10" max="100" value="50"
style="width:90%;accent-color:#00d9ff">
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

const pockets=[
{x:35,y:35},{x:465,y:35},
{x:35,y:465},{x:465,y:465}
];

let coins=[],striker,striker2;
Effects=[];
let gameOver=false;
let foulThisTurn=false;
let queenPendingPlayer=0;
let queenCoin=null;
let queenExtraTurnUsed=false;
let shotQueenExtraTurnSnapshot=false;
let currentPlayer=1;
let scores=[0,0,0];
let dragging=false,dragX=0,dragY=0;
let paused=false,moving=false;
let shotInProgress=false,robotThinking=false;
let coinPocketedThisTurn=false;
let pocketedCoinsThisShot=[];
let shotScoreSnapshot=[0,0,0];
let shotCoinSnapshot=[];
let shotQueenPendingSnapshot=0;
let shotQueenCoinSnapshot=null;
let soundEnabled=true,audioContext=null;
let lastCollisionSound=0;
let robotLevel="hard";
let strikerPower=50;

document.getElementById("powerBar").addEventListener("input",function(){
  strikerPower=Number(this.value);
  document.getElementById("powerValue").innerText=strikerPower;
});

document.getElementById("robotLevel").addEventListener("change",function(){
  robotLevel=this.value;
});

// SOUND
function playTone(frequency,duration,type="sine",volume=0.12){
  if(!soundEnabled)return;
  try{
    if(!audioContext){
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtx)return;
      audioContext=new AudioCtx();
    }
    if(audioContext.state==="suspended")audioContext.resume();
    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();
    oscillator.type=type;
    oscillator.frequency.setValueAtTime(frequency,audioContext.currentTime);
    gain.gain.setValueAtTime(volume,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioContext.currentTime+duration);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime+duration);
  }catch(e){}
}

function saveShotState(){
  pocketedCoinsThisShot=[];
  coinPocketedThisTurn=false;
  shotScoreSnapshot=scores.slice();
  // Shot shuru hone se pehle har coin ki asli position save karo.
  shotCoinSnapshot=coins.map(coin=>({
    coin,
    x:coin.x,
    y:coin.y,
    active:coin.active
  }));
  shotQueenPendingSnapshot=queenPendingPlayer;
  shotQueenCoinSnapshot=queenCoin;
  shotQueenExtraTurnSnapshot=queenExtraTurnUsed;
}

function undoShotForFoul(){
  // Foul hone par shot se pehle wali sabhi coins ki position wapas lao.
  for(const item of shotCoinSnapshot){
    item.coin.active=item.active;
    item.coin.x=item.x;
    item.coin.y=item.y;
    item.coin.vx=0;
    item.coin.vy=0;
  }

  scores=shotScoreSnapshot.slice();
  queenPendingPlayer=shotQueenPendingSnapshot;
  queenCoin=shotQueenCoinSnapshot;
  queenExtraTurnUsed=shotQueenExtraTurnSnapshot;
  pocketedCoinsThisShot=[];
  coinPocketedThisTurn=false;
  updateScore();
}

function playShotSound(){playTone(180,0.12,"triangle",0.16);}

function playCollisionSound(){
  const now=Date.now();
  if(now-lastCollisionSound<100)return;
  lastCollisionSound=now;
  playTone(550,0.06,"triangle",0.09);
}

function playPocketSound(){
  playTone(700,0.12,"sine",0.15);
  setTimeout(()=>playTone(420,0.18,"sine",0.10),90);
}

function toggleSound(){
  soundEnabled=!soundEnabled;
  document.getElementById("soundBtn").innerText=
    soundEnabled?"🔊 Sound ON":"🔇 Sound OFF";
  if(soundEnabled)playTone(600,0.1);
}

// COINS
function makeCoin(x,y,color,r=12){
  return{x,y,color,r,vx:0,vy:0,active:true};
}

function resetGame(){
  coins=[
    makeCoin(250,250,"red",13),
    makeCoin(220,250,"black"),
    makeCoin(280,250,"white"),
    makeCoin(250,220,"black"),
    makeCoin(250,280,"white"),
    makeCoin(220,220,"white"),
    makeCoin(280,280,"black"),
    makeCoin(280,220,"white"),
    makeCoin(220,280,"black")
  ];

  striker=makeCoin(250,397,"darkblue",17);
  striker2=makeCoin(250,100,"darkblue",17);
  currentPlayer=1;
  scores=[0,0,0];
  dragging=false;
  moving=false;
  shotInProgress=false;
  robotThinking=false;
  paused=false;
  gameOver=false;
  foulThisTurn=false;
  coinPocketedThisTurn=false;
  pocketedCoinsThisShot=[];
  shotScoreSnapshot=scores.slice();
  shotQueenPendingSnapshot=0;
  shotQueenCoinSnapshot=null;
  queenPendingPlayer=0;
  queenCoin=null;
  queenExtraTurnUsed=false;
  hitEffects=[];
  document.getElementById("victoryScreen").style.display="none";
  document.getElementById("pauseBtn").innerText="⏸ Pause";
  updateScore();
  draw();
}

function showVictoryScreen(){
  let winner=scores[1]>=9?"PLAYER 1":"ROBOT";
  gameOver=true;
  document.getElementById("winnerName").innerText=winner+" WINS! 🎉";
  document.getElementById("finalScore").innerText=
    "Player 1: "+scores[1]+" | Robot: "+scores[2];
  document.getElementById("victoryScreen").style.display="flex";
}

function updateScore(){
  document.getElementById("score1").innerText=scores[1];
  document.getElementById("score2").innerText=scores[2];
  document.getElementById("total").innerText=scores[0];
  document.getElementById("status").innerText=
    currentPlayer===1?"Player 1 Turn":"🤖 Robot Turn";
}

// DRAW
function drawCoin(c){
  if(!c.active)return;
  ctx.save();

  ctx.beginPath();
  ctx.ellipse(c.x+3,c.y+5,c.r*.95,c.r*.65,0,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.30)";
  ctx.fill();

  let gradient=ctx.createRadialGradient(
    c.x-c.r*.4,c.y-c.r*.5,1,c.x,c.y,c.r*1.2
  );

  if(c.color==="white"){
    gradient.addColorStop(0,"#fff");
    gradient.addColorStop(.6,"#dedede");
    gradient.addColorStop(1,"#888");
  }else if(c.color==="black"){
    gradient.addColorStop(0,"#777");
    gradient.addColorStop(.6,"#292929");
    gradient.addColorStop(1,"#050505");
  }else if(c.color==="red"){
    gradient.addColorStop(0,"#ffaaaa");
    gradient.addColorStop(.6,"#e00000");
    gradient.addColorStop(1,"#700000");
  }else{
    gradient.addColorStop(0,"#8bdcff");
    gradient.addColorStop(.6,"#004b99");
    gradient.addColorStop(1,"#00152e");
  }

  ctx.beginPath();
  ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
  ctx.fillStyle=gradient;
  ctx.fill();
  ctx.strokeStyle="#333";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(c.x-c.r*.28,c.y-c.r*.3,c.r*.23,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,.65)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(c.x,c.y,13,0,Math.PI*2);
  ctx.strokeStyle="rgba(255,255,255,.9)";
  ctx.lineWidth=1.5;
  ctx.stroke();

  // R LOGO - इसे वैसा ही रखा है
  if(c===striker){
    ctx.fillStyle="white";
    ctx.font="bold 18px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("R",c.x,c.y);
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,500,500);
  let boardGradient=ctx.createLinearGradient(0,0,500,500);
  boardGradient.addColorStop(0,"#f7d69c");
  boardGradient.addColorStop(.5,"#dba866");
  boardGradient.addColorStop(1,"#f3ca8a");
  ctx.fillStyle=boardGradient;
  ctx.fillRect(0,0,500,500);

  ctx.strokeStyle="#75431f";
  ctx.lineWidth=5;
  ctx.strokeRect(35,35,430,430);

  pockets.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,23,0,Math.PI*2);
    ctx.fillStyle="#171717";
    ctx.fill();
  });

  ctx.strokeStyle="#a16b32";
  ctx.lineWidth=2;
  ctx.strokeRect(90,390,320,25);
  ctx.strokeRect(90,85,320,25);

  coins.forEach(drawCoin);
  if(currentPlayer===1)drawCoin(striker);
  else drawCoin(striker2);

  hitEffects.forEach(e=>{
    ctx.beginPath();
    ctx.arc(e.x,e.y,15-e.life/2,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,255,255,${e.life/15})`;
    ctx.lineWidth=3;
    ctx.stroke();
  });

  if(dragging){
    let dx=striker.x-dragX;
    let dy=striker.y-dragY;
    let length=Math.hypot(dx,dy);

    if(length>0){
      let aimX=dx/length;
      let aimY=dy/length;
      const guideLength=Math.min(220,90+length*1.8);
      const endX=striker.x+aimX*guideLength;
      const endY=striker.y+aimY*guideLength;

      // CLEAR AIM ARROW: drag direction is opposite to the shot direction
      ctx.save();
      const angle=Math.atan2(aimY,aimX);

      // Bright arrow shaft with a soft glow
      ctx.shadowColor="#00eaff";
      ctx.shadowBlur=16;
      ctx.strokeStyle="rgba(0,235,255,.95)";
      ctx.lineWidth=4;
      ctx.setLineDash([9,6]);
      ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(striker.x,striker.y);
      ctx.lineTo(endX,endY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Large arrow head
      ctx.fillStyle="#d8ffff";
      ctx.strokeStyle="#00bfe8";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(endX,endY);
      ctx.lineTo(
        endX-21*Math.cos(angle-Math.PI/6),
        endY-21*Math.sin(angle-Math.PI/6)
      );
      ctx.lineTo(
        endX-21*Math.cos(angle+Math.PI/6),
        endY-21*Math.sin(angle+Math.PI/6)
      );
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Small target ring at the arrow tip
      ctx.beginPath();
      ctx.arc(endX,endY,8,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,255,255,.95)";
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.restore();
    }
  }
}
// PLAYER CONTROL

function getPosition(e){
  const rect=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-rect.left)*500/rect.width,
    y:(e.clientY-rect.top)*500/rect.height
  };
}

canvas.addEventListener("pointerdown",e=>{
  if(gameOver||paused||moving||currentPlayer===2||robotThinking)return;

  const p=getPosition(e);

  if(Math.hypot(p.x-striker.x,p.y-striker.y)<striker.r+10){
    dragging=true;
    dragX=p.x;
    dragY=p.y;
    canvas.setPointerCapture(e.pointerId);
    draw();
  }
});

canvas.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const p=getPosition(e);
  dragX=p.x;
  dragY=p.y;
  draw();
});

canvas.addEventListener("pointerup",e=>{
  if(!dragging)return;

  const p=getPosition(e);
  let dx=striker.x-p.x;
  let dy=striker.y-p.y;
  let power=Math.hypot(dx,dy);

  if(power>3){
    saveShotState();
    let powerMultiplier=strikerPower/50;
    striker.vx=dx*0.20*powerMultiplier;
    striker.vy=dy*0.20*powerMultiplier;

    moving=true;
    shotInProgress=true;
    playShotSound();
  }

  dragging=false;
  draw();
});

canvas.addEventListener("pointercancel",()=>{
  dragging=false;
  draw();
});


// COLLISION SYSTEM

function collide(a,b){
  if(!a.active||!b.active)return;

  let dx=b.x-a.x;
  let dy=b.y-a.y;
  let dist=Math.hypot(dx,dy);
  let minDist=a.r+b.r;

  if(dist===0||dist>=minDist)return;

  let nx=dx/dist;
  let ny=dy/dist;

  let massA=a.r*a.r;
  let massB=b.r*b.r;

  let overlap=minDist-dist;
  let totalMass=massA+massB;

  a.x-=nx*overlap*(massB/totalMass);
  a.y-=ny*overlap*(massB/totalMass);

  b.x+=nx*overlap*(massA/totalMass);
  b.y+=ny*overlap*(massA/totalMass);

  let relative=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;

  if(relative>0){
    let restitution=0.88;
    let impulse=(1+restitution)*relative/
      (1/massA+1/massB);

    a.vx-=impulse*nx/massA;
    a.vy-=impulse*ny/massA;

    b.vx+=impulse*nx/massB;
    b.vy+=impulse*ny/massB;

    playCollisionSound();

    hitEffects.push({
      x:(a.x+b.x)/2,
      y:(a.y+b.y)/2,
      life:15
    });
  }
}


// POCKET SYSTEM

function pocketCheck(c){
  if(!c.active)return false;

  for(const p of pockets){
    const captureRadius=22+c.r+5;
    const distance=Math.hypot(c.x-p.x,c.y-p.y);

    if(distance<=captureRadius){
      playPocketSound();

      // Striker foul
      if(c===striker||c===striker2){
        if(c===striker){
          c.x=250;
          c.y=397;
        }else{
          c.x=250;
          c.y=98;
        }

        c.vx=0;
        c.vy=0;
        foulThisTurn=true;
        undoShotForFoul();

        // Striker pocket hone par current player ka 1 penalty point kam karo.
        scores[currentPlayer]=Math.max(0,scores[currentPlayer]-1);
        updateScore();

        document.getElementById("status").innerText=
          "⚠️ Striker Foul! -1 Point";

        return true;
      }

      // Queen pocket hone par board se gayab rahegi.
      // Queen pocket karne wale player ko ek extra shot milega.
      // Us extra shot mein koi normal coin pocket na hui to Queen centre mein lautegi.
      if(c.color==="red"){
        if(queenPendingPlayer!==0){
          c.x=250;
          c.y=250;
          c.vx=0;
          c.vy=0;
          document.getElementById("status").innerText=
            "👑 Pehle Queen ko cover karo!";
          return true;
        }

        pocketedCoinsThisShot.push({coin:c,x:c.x,y:c.y});
        c.active=false;
        c.vx=0;
        c.vy=0;
        queenPendingPlayer=currentPlayer;
        queenCoin=c;
        queenExtraTurnUsed=false;
        coinPocketedThisTurn=true;
        document.getElementById("status").innerText=
          "👑 Queen pocket ho gayi! Aapko ek aur shot milega—coin pocket karke cover karo!";
        return true;
      }

      pocketedCoinsThisShot.push({coin:c,x:c.x,y:c.y});
      c.active=false;
      c.vx=0;
      c.vy=0;
      scores[0]++;
      scores[currentPlayer]++;

      // Queen cover: sirf queen ke baad pocket hui coin cover karegi.
      if(queenPendingPlayer===currentPlayer){
        scores[currentPlayer]+=3;
        queenPendingPlayer=0;
        queenCoin=null;
        queenExtraTurnUsed=false;
        coinPocketedThisTurn=true;
        document.getElementById("status").innerText=
          "👑 QUEEN COVERED! +3 BONUS! Aapki dobara turn hai.";
      }else{
        coinPocketedThisTurn=true;
      }

      updateScore();
      return true;
    }
  }

  return false;
}


// WALL BOUNCE

function moveCoin(c){
  if(!c.active)return;

  c.x+=c.vx;
  c.y+=c.vy;

  c.vx*=0.985;
  c.vy*=0.985;

  if(Math.abs(c.vx)<0.04)c.vx=0;
  if(Math.abs(c.vy)<0.04)c.vy=0;

  if(pocketCheck(c))return;

  const min=45;
  const max=445;

  const captureRadius=22+c.r+5;
  const edgeOffset=20+c.r;
  const gap=Math.sqrt(Math.max(0,
    captureRadius*captureRadius-edgeOffset*edgeOffset
  ));

  const leftOpen=
    Math.abs(c.y-20)<=gap||Math.abs(c.y-465)<=gap;

  const rightOpen=
    Math.abs(c.y-20)<=gap||Math.abs(c.y-465)<=gap;

  const topOpen=
    Math.abs(c.x-20)<=gap||Math.abs(c.x-465)<=gap;

  const bottomOpen=
    Math.abs(c.x-20)<=gap||Math.abs(c.x-465)<=gap;

  if(c.x-c.r<min&&!leftOpen){
    c.x=min+c.r;
    c.vx=Math.abs(c.vx)*0.8;
  }

  if(c.x+c.r>max&&!rightOpen){
    c.x=max-c.r;
    c.vx=-Math.abs(c.vx)*0.8;
  }

  if(c.y-c.r<min&&!topOpen){
    c.y=min+c.r;
    c.vy=Math.abs(c.vy)*0.8;
  }

  if(c.y+c.r>max&&!bottomOpen){
    c.y=max-c.r;
    c.vy=-Math.abs(c.vy)*0.8;
  }
}


// ROBOT AI

function startRobotTurn(){
  if(gameOver)return;
  if(currentPlayer!==2||paused||robotThinking)return;

  robotThinking=true;

  let settings={
    easy:{delay:1300,power:0.65,error:0.22},
    medium:{delay:1000,power:0.82,error:0.10},
    hard:{delay:700,power:1.0,error:0.02}
  };

  let level=settings[robotLevel];

  setTimeout(()=>{
    if(paused||currentPlayer!==2||gameOver){
      robotThinking=false;
      return;
    }

    let targets=coins.filter(c=>c.active);

    if(targets.length===0){
      robotThinking=false;
      currentPlayer=1;
      updateScore();
      return;
    }

    let bestShot=null;
    let bestScore=Infinity;

    for(const coin of targets){
      for(const pocket of pockets){
        let dx=pocket.x-coin.x;
        let dy=pocket.y-coin.y;
        let dist=Math.hypot(dx,dy);

        if(dist===0)continue;

        let ux=dx/dist;
        let uy=dy/dist;

        let ghostX=coin.x-ux*(coin.r+striker2.r+2);
        let ghostY=coin.y-uy*(coin.r+striker2.r+2);

        if(ghostX<55||ghostX>445||ghostY<55||ghostY>445)continue;

        let sx=ghostX-striker2.x;
        let sy=ghostY-striker2.y;
        let shotDistance=Math.hypot(sx,sy);

        if(shotDistance<1)continue;

        let dot=sx*ux+sy*uy;
        if(dot<=0)continue;

        let alignment=Math.abs(sx*uy-sy*ux)/shotDistance;
        let score=shotDistance+dist*0.25+alignment*8;

        if(score<bestScore){
          bestScore=score;
          bestShot={x:ghostX,y:ghostY};
        }
      }
    }

    if(!bestShot){
      let target=targets.reduce((a,b)=>{
        let da=Math.hypot(a.x-striker2.x,a.y-striker2.y);
        let db=Math.hypot(b.x-striker2.x,b.y-striker2.y);
        return da<db?a:b;
      });

      bestShot={x:target.x,y:target.y};
    }

    let dx=bestShot.x-striker2.x;
    let dy=bestShot.y-striker2.y;
    let distance=Math.hypot(dx,dy);

    if(distance>0){
      saveShotState();
      let angle=Math.atan2(dy,dx);
      angle+=(Math.random()-0.5)*level.error;

      let power=Math.min(13,Math.max(6,distance*0.055));
      power*=level.power;

      striker2.vx=Math.cos(angle)*power;
      striker2.vy=Math.sin(angle)*power;

      moving=true;
      shotInProgress=true;
      playShotSound();
    }

    robotThinking=false;

  },level.delay);
}
// ACTIVE STRIKER
function getActiveStriker(){
  return currentPlayer===1?striker:striker2;
}

// CHECK MOVEMENT
function isAnythingMoving(){
  const all=[...coins,striker,striker2];

  return all.some(c=>
    c.active&&(Math.abs(c.vx)>0.08||Math.abs(c.vy)>0.08)
  );
}

// CHECK WINNER
function checkWinner(){
  if(scores[1]>=9||scores[2]>=9){
    gameOver=true;

    document.getElementById("winnerName").innerText=
      scores[1]>=9?"PLAYER 1 WINS! 🎉":"ROBOT WINS! 🤖";

    document.getElementById("finalScore").innerText=
      "Player 1: "+scores[1]+" | Robot: "+scores[2];

    document.getElementById("victoryScreen").style.display="flex";
    return true;
  }
  return false;
}

// CHANGE TURN
function finishTurn(){
  moving=false;
  shotInProgress=false;

  // Queen pocket karne ke baad same player ko ek extra shot do.
  // Agar us extra shot mein normal coin pocket nahi hui, Queen wapas lao.
  if(queenPendingPlayer===currentPlayer && queenCoin && queenCoin.active===false){
    if(!queenExtraTurnUsed){
      queenExtraTurnUsed=true;
      coinPocketedThisTurn=true; // same player ko extra shot
      document.getElementById("status").innerText=
        "👑 Queen gayab hai! Ab ek coin pocket karke cover karo.";
    }else{
      queenCoin.active=true;
      queenCoin.x=250;
      queenCoin.y=250;
      queenCoin.vx=0;
      queenCoin.vy=0;
      queenPendingPlayer=0;
      queenCoin=null;
      queenExtraTurnUsed=false;
      coinPocketedThisTurn=false;
      document.getElementById("status").innerText=
        "👑 Cover nahi hui! Queen centre mein wapas aa gayi.";
    }
  }

  if(foulThisTurn){
    foulThisTurn=false;
    coinPocketedThisTurn=false;
    currentPlayer=currentPlayer===1?2:1;
  }else if(!coinPocketedThisTurn){
    currentPlayer=currentPlayer===1?2:1;
  }

  coinPocketedThisTurn=false;
  pocketedCoinsThisShot=[];

  updateScore();

  if(!checkWinner()&&currentPlayer===2){
    startRobotTurn();
  }

  draw();
}

// MAIN GAME LOOP
function gameLoop(){

  if(!paused&&!gameOver){

    if(moving){

      const activeStriker=getActiveStriker();
      const allCoins=[...coins,activeStriker];

      // Move all coins
      allCoins.forEach(moveCoin);

      // Coin-to-coin collisions
      for(let i=0;i<allCoins.length;i++){
        for(let j=i+1;j<allCoins.length;j++){
          collide(allCoins[i],allCoins[j]);
        }
      }

      // Remove old hit effects
      hitEffects.forEach(e=>e.life--);
      hitEffects=hitEffects.filter(e=>e.life>0);

      // Check if everything stopped
      if(!isAnythingMoving()){
        finishTurn();
      }
    }

    draw();
  }

  requestAnimationFrame(gameLoop);
}

// PAUSE BUTTON
function pauseGame(){

  if(gameOver)return;

  paused=!paused;

  document.getElementById("pauseBtn").innerText=
    paused?"▶ Resume":"⏸ Pause";

  if(!paused){
    draw();

    if(currentPlayer===2&&!moving&&!robotThinking){
      startRobotTurn();
    }
  }
}

// START GAME
resetGame();
gameLoop();

</script>
